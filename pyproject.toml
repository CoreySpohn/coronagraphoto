[build-system]
requires = ['hatchling>=1.26.3', "hatch-fancy-pypi-readme>=24.1.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "coronagraphoto"
description = "A python library to simulate coronagraphic observations of exoplanets."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "hwoutils>=1.10.0",
  "jax>=0.8.1",
  "optixstuff>=3.0.0",
  "orbix>=3.0.0",
  "pooch>=1.8.2",
  "yippy>=2.10.6",
  "skyscapes>=2.1.0",
]
[project.optional-dependencies]
dev = ["pre-commit>=3.5.0"]
docs = [
  "sphinx>=7.2.6",
  "myst-nb>=1.0.0",
  "sphinx-book-theme>=1.1.0",
  "sphinx-autoapi>=3.0.0",
  "sphinxcontrib-mermaid>=0.9.2",
  "ipython>=8.18.1",
]
test = [
  "pytest>=7.3.2",
  "hypothesis>=6.79.1",
  "pytest-xdist>=2.5",
  "pytest-testmon>=2.0.7",
  "pytest-markdown-docs>=0.5.0",
  "pytest-timeout>=1.3.1",
  "pytest-fail-slow>=0.1.0",
  "equinox>=0.13.2",
  "lod_unit>=1.8.0",
  "numpy>=2.1.2",
  "packaging>=23.1",
]

[project.urls]
Homepage = "https://github.com/CoreySpohn/coronagraphoto"
Issues = "https://github.com/CoreySpohn/coronagraphoto/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/coronagraphoto/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  # HITRAN HAPI uses non-raw regex strings that Python 3.12 flags at compilation.
  'ignore:invalid escape sequence:SyntaxWarning:.*[/\\]hapi[/\\]hapi$',
  # ExoJAX also uses non-raw regex strings and docstrings on Python 3.12.
  'ignore:invalid escape sequence:SyntaxWarning:.*[/\\]exojax[/\\]',
  # Vaex regex strings and docstring examples contain Python 3.12 escapes.
  'ignore:invalid escape sequence:SyntaxWarning:.*[/\\]vaex[/\\]',
  # ExoJAX redirects the HAPI import to /dev/null without closing its stream.
  'ignore:unclosed file <_io\.TextIOWrapper name=.*/dev/null.*:ResourceWarning:exojax\.database\._common\.hitranapi$',
]
markers = [
    "slow: tests that take longer than a few seconds (deselect with -m 'not slow')",
    "medium: tests with a 30-second default time budget",
    "integration: end-to-end tests against real fixtures (deselect with -m 'not integration')",
]

[tool.testbudget]
library = "coronagraphoto"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["coronagraphoto"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# optixstuff supplies the duck-typed OpticalPath consumed by the simulation API.
# orbix's floor preserves the sky-coordinate convention of loaded skyscapes scenes.
DEP002 = ["optixstuff", "orbix"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/coronagraphoto"]
